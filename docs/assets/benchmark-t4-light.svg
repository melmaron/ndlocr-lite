<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 432" width="880" height="432" role="img" aria-labelledby="t4-title t4-desc">
  <title id="t4-title">Google Colab T4 Benchmark — 12 Pages (Bundled resource/ Samples)</title>
  <desc id="t4-desc">Light theme comparison of end-to-end and steady-state 12-page OCR times and VRAM on Tesla T4 across CPU batch=1 and CUDA batch=1, 8, 16, and 32.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 16px; font-weight: 700; fill: #1f2328; }
    .subtitle { font-size: 11.5px; fill: #59636e; }
    .card-title { font-size: 13.5px; font-weight: 700; fill: #1f2328; }
    .card-sub { font-size: 11px; fill: #59636e; }
    .row-label { font-size: 11.5px; fill: #1f2328; }
    .row-val { font-size: 11.5px; font-weight: 600; fill: #1f2328; }
    .row-val-best { font-size: 11.5px; font-weight: 700; fill: #116329; }
    .pill-text { font-size: 11px; font-weight: 600; fill: #116329; }
    .footer { font-size: 10.5px; fill: #59636e; }
  </style>

  <!-- Canvas -->
  <rect x="0.5" y="0.5" width="879" height="431" rx="12" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Header -->
  <text x="20" y="30" class="sans title">Google Colab T4 Benchmark — 12 Pages (Bundled resource/ Samples)</text>
  <text x="20" y="49" class="sans subtitle">Tesla T4 15 GiB · ONNX Runtime GPU 1.31.1 · FP32 Default (0-diff Parity vs CPU batch=1)</text>

  <!-- Left Card -->
  <rect x="20" y="66" width="412" height="318" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="38" y="90" class="sans card-title">End-to-End 12 Pages (Init Included)</text>
  <text x="38" y="106" class="sans card-sub">ocr.process total time · lower is faster</text>

  <!-- Left Card Rows -->
  <text x="38" y="132" class="sans row-label">CPU batch=1</text>
  <text x="414" y="132" text-anchor="end" class="sans row-val">91.2s (1.0x)</text>
  <rect x="38" y="139" width="376" height="10" rx="5" fill="#eaeef2"/>
  <rect x="38" y="139" width="376" height="10" rx="5" fill="#8c959f"/>

  <text x="38" y="174" class="sans row-label">CUDA batch=32 (before opt)</text>
  <text x="414" y="174" text-anchor="end" class="sans row-val">60.4s (1.5x)</text>
  <rect x="38" y="181" width="376" height="10" rx="5" fill="#eaeef2"/>
  <rect x="38" y="181" width="249" height="10" rx="5" fill="#d4a72c"/>

  <text x="38" y="216" class="sans row-label">CUDA batch=1</text>
  <text x="414" y="216" text-anchor="end" class="sans row-val">23.7s (3.9x)</text>
  <rect x="38" y="223" width="376" height="10" rx="5" fill="#eaeef2"/>
  <rect x="38" y="223" width="98" height="10" rx="5" fill="#54aeff"/>

  <text x="38" y="258" class="sans row-label">CUDA batch=8 + pipeline</text>
  <text x="414" y="258" text-anchor="end" class="sans row-val">14.7s (6.2x)</text>
  <rect x="38" y="265" width="376" height="10" rx="5" fill="#eaeef2"/>
  <rect x="38" y="265" width="61" height="10" rx="5" fill="#0969da"/>

  <text x="38" y="300" class="sans row-label">CUDA batch=32 + pipeline</text>
  <text x="414" y="300" text-anchor="end" class="sans row-val">14.6s (6.3x)</text>
  <rect x="38" y="307" width="376" height="10" rx="5" fill="#eaeef2"/>
  <rect x="38" y="307" width="60" height="10" rx="5" fill="#0969da"/>

  <text x="38" y="342" class="sans row-label">CUDA batch=16 + pipeline</text>
  <text x="414" y="342" text-anchor="end" class="sans row-val-best">14.5s (6.3x · Fastest)</text>
  <rect x="38" y="349" width="376" height="10" rx="5" fill="#eaeef2"/>
  <rect x="38" y="349" width="60" height="10" rx="5" fill="#1a7f37"/>

  <!-- Right Card -->
  <rect x="448" y="66" width="412" height="318" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="466" y="90" class="sans card-title">Steady-State 12 Pages (Excl. Init &amp; Warmup)</text>
  <text x="466" y="106" class="sans card-sub">Isolated process inference + resident VRAM · lower is faster</text>

  <!-- Right Card Rows -->
  <text x="466" y="132" class="sans row-label">CPU batch=1 (page loop)</text>
  <text x="842" y="132" text-anchor="end" class="sans row-val">80.0s · 0.15 p/s</text>
  <rect x="466" y="139" width="376" height="10" rx="5" fill="#eaeef2"/>
  <rect x="466" y="139" width="376" height="10" rx="5" fill="#8c959f"/>

  <text x="466" y="174" class="sans row-label">CUDA batch=1</text>
  <text x="842" y="174" text-anchor="end" class="sans row-val">12.6s · 0.95 p/s · 882 MiB</text>
  <rect x="466" y="181" width="376" height="10" rx="5" fill="#eaeef2"/>
  <rect x="466" y="181" width="59" height="10" rx="5" fill="#54aeff"/>

  <text x="466" y="216" class="sans row-label">CUDA batch=8</text>
  <text x="842" y="216" text-anchor="end" class="sans row-val">4.3s · 2.80 p/s · 1,008 MiB</text>
  <rect x="466" y="223" width="376" height="10" rx="5" fill="#eaeef2"/>
  <rect x="466" y="223" width="20" height="10" rx="5" fill="#0969da"/>

  <text x="466" y="258" class="sans row-label">CUDA batch=16</text>
  <text x="842" y="258" text-anchor="end" class="sans row-val">4.0s · 3.03 p/s · 1,142 MiB</text>
  <rect x="466" y="265" width="376" height="10" rx="5" fill="#eaeef2"/>
  <rect x="466" y="265" width="19" height="10" rx="5" fill="#0969da"/>

  <text x="466" y="300" class="sans row-label">CUDA batch=32</text>
  <text x="842" y="300" text-anchor="end" class="sans row-val-best">3.9s · 3.10 p/s · 1,524 MiB</text>
  <rect x="466" y="307" width="376" height="10" rx="5" fill="#eaeef2"/>
  <rect x="466" y="307" width="18" height="10" rx="5" fill="#1a7f37"/>

  <!-- Summary Pill -->
  <rect x="466" y="342" width="376" height="26" rx="6" fill="#dafbe1" stroke="#aceebb"/>
  <text x="654" y="359" text-anchor="middle" class="sans pill-text">Speedup: 3.25x vs CUDA b=1 · 20.6x vs CPU · TXT/XML/JSON 0 diff</text>

  <!-- Footer -->
  <text x="20" y="406" class="sans footer">Optimization: enable_mem_reuse=False for dynamic-batch PARSeq (removes 45s+ ORT allocation_planner init overhead) + CUDA HEURISTIC.</text>
  <text x="20" y="421" class="sans footer">Verified on 5 bundled images (225 lines, --enable-tcy off &amp; on) and 12-page batch; TableCenterNet v3 DeformConv verified on CUDA.</text>
</svg>
