name: build-flet-cross

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      version:
        description: "Build version string (e.g. 2.0.0)"
        required: true
        default: "2.0.0"
        type: string

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: "Create Release"
        run: gh release create "${{ github.ref_name }}" --draft --verify-tag --notes "Release ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONLEGACYWINDOWSSTDIO: "utf-8"
          PYTHONIOENCODING: "UTF-8"
          PYTHONUTF8: 1

  cross-build:
    needs: [create-release]
    if: always() && (github.event_name == 'workflow_dispatch' || needs.create-release.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-22.04
            variant: gpu-generic
            target-platform: linux
            artifact-suffix: linux_gpu_generic.tar.gz
          - runs-on: ubuntu-22.04
            variant: cuda
            target-platform: linux
            artifact-suffix: linux_cuda.tar.gz
          - runs-on: windows-2022
            variant: gpu-generic
            target-platform: windows
            artifact-suffix: windows_gpu_generic.zip
          - runs-on: windows-2022
            variant: cuda
            target-platform: windows
            artifact-suffix: windows_cuda.zip
          - runs-on: macos-latest
            variant: base
            target-platform: macos
            artifact-suffix: macos_apple_silicon.tar.gz
          - runs-on: macos-15-intel
            variant: base
            target-platform: macos
            artifact-suffix: macos_intel.tar.gz
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: write
    env:
      BUILD_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"

      - name: Select backend requirements variant
        shell: bash
        run: |
          variant="${{ matrix.variant }}"
          if [ "$variant" = "gpu-generic" ]; then
            cp requirements-gpu-generic.txt requirements.txt
            cp ndlocr-lite-gui/requirements-gpu-generic.txt ndlocr-lite-gui/requirements.txt
          elif [ "$variant" = "cuda" ]; then
            cp requirements-cuda.txt requirements.txt
            cp ndlocr-lite-gui/requirements-cuda.txt ndlocr-lite-gui/requirements.txt
          fi
          echo "BINARY_NAME=ndlocr_lite_v${BUILD_VERSION}_${{ matrix.artifact-suffix }}" >> "$GITHUB_ENV"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Install GStreamer libraries"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev ninja-build libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-tools gstreamer1.0-x gstreamer1.0-alsa gstreamer1.0-gl gstreamer1.0-gtk3 gstreamer1.0-qt5 gstreamer1.0-pulseaudio

      - name: "Flet build"
        if: runner.os != 'Windows'
        run: |
          cd ndlocr-lite-gui
          cp -r ../src .
          python src/set_version.py "${BUILD_VERSION}"
          EXTRA_ARGS=""
          if [ "${{ matrix.runs-on }}" = "macos-15-intel" ]; then
            echo "Intel Mac detected: Configuring specific settings..."
            EXTRA_ARGS="--arch x86_64"
          elif [ "${{ matrix.target-platform }}" = "macos" ]; then
            EXTRA_ARGS="--arch arm64"
          fi
          flet build ${{ matrix.target-platform }} --output ../${{ matrix.target-platform }} --build-version "${BUILD_VERSION}" $EXTRA_ARGS --python-version 3.12

      - name: "Flet build(Windows)"
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cd ndlocr-lite-gui
          echo D | xcopy ..\src .\src /E /I /Y
          python src\set_version.py "%BUILD_VERSION%"
          set PYTHONUTF8=1
          flet build ${{ matrix.target-platform }} --output ..\${{ matrix.target-platform }} --build-version "%BUILD_VERSION%"
          copy main.py ..\${{ matrix.target-platform }}

      - name: "Linux/MacOS compress"
        if: runner.os != 'Windows'
        run: tar zcvf "${BINARY_NAME}" ${{ matrix.target-platform }}

      - name: "Windows compress"
        if: runner.os == 'Windows'
        run: powershell Compress-Archive -Path ${{ matrix.target-platform }} -DestinationPath "${env:BINARY_NAME}"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}
          path: ${{ env.BINARY_NAME }}
          retention-days: 7

      - name: "Upload Release"
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release upload "${{ github.ref_name }}" "${BINARY_NAME}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
