name: build-flet-cross

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      version:
        description: "Build version string (e.g. 2.0.3)"
        required: true
        default: "2.0.3"
        type: string
      create_release:
        description: "Create/publish a GitHub Release (disable for test builds)"
        required: false
        default: true
        type: boolean

jobs:
  create-release:
    if: github.event_name == 'push' || inputs.create_release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: "Create or reuse draft release"
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; assets will be overwritten."
          else
            gh release create "$RELEASE_TAG" \
              --draft \
              --title "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --notes "GUI デスクトップアプリケーションのビルド済みパッケージ（NDLOCR-Lite GPU fork / ${RELEASE_TAG}）。Windows / Linux の 4 ターゲット構成です（macOS 版は非提供）。cuda 版（windows_cuda.zip / linux_cuda.tar.gz）は CUDA 13 + cuDNN 9 ランタイムを同梱済みのため CUDA Toolkit の別途導入は不要です（CUDA 13 対応 NVIDIA ドライバ R580 以降が必要・容量約 1.2〜1.6 GB）。gpu_generic 版は WebGPU / OpenVINO / TBB ランタイムを同梱済みです（Windows は DirectX 12 ドライバ、Linux は Vulkan libvulkan.so.1 + GPU ドライバ + GTK3 / glibc 2.35+ が必要）。Windows 版は Visual C++ ランタイム DLL も同梱します。展開先は日本語（全角文字）を含まないパスにしてください。"
          fi

  cross-build:
    needs: [create-release]
    if: always() && (github.event_name == 'workflow_dispatch' || needs.create-release.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-22.04
            variant: gpu-generic
            target-platform: linux
            artifact-suffix: linux_gpu_generic.tar.gz
          - runs-on: ubuntu-22.04
            variant: cuda
            target-platform: linux
            artifact-suffix: linux_cuda.tar.gz
          - runs-on: windows-2022
            variant: gpu-generic
            target-platform: windows
            artifact-suffix: windows_gpu_generic.zip
          - runs-on: windows-2022
            variant: cuda
            target-platform: windows
            artifact-suffix: windows_cuda.zip
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: write
    env:
      BUILD_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PIP_NO_CACHE_DIR: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"

      - name: Select backend requirements variant
        shell: bash
        run: |
          variant="${{ matrix.variant }}"
          if [ "$variant" = "gpu-generic" ]; then
            cp requirements-gpu-generic.txt requirements.txt
            cp ndlocr-lite-gui/requirements-gpu-generic.txt ndlocr-lite-gui/requirements.txt
          elif [ "$variant" = "cuda" ]; then
            cp requirements-cuda.txt requirements.txt
            cp ndlocr-lite-gui/requirements-cuda.txt ndlocr-lite-gui/requirements.txt
          fi
          echo "BINARY_NAME=ndlocr_lite_gpu_v${BUILD_VERSION}_${{ matrix.artifact-suffix }}" >> "$GITHUB_ENV"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir flet==1.1.2

      - name: "Install GStreamer libraries"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev ninja-build libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-tools gstreamer1.0-x gstreamer1.0-alsa gstreamer1.0-gl gstreamer1.0-gtk3 gstreamer1.0-qt5 gstreamer1.0-pulseaudio

      - name: "Flet build"
        if: runner.os != 'Windows'
        run: |
          cd ndlocr-lite-gui
          cp -r ../src .
          python src/set_version.py "${BUILD_VERSION}"
          flet build ${{ matrix.target-platform }} --output ../${{ matrix.target-platform }} --build-version "${BUILD_VERSION}" --python-version 3.12

      - name: "Flet build(Windows)"
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cd ndlocr-lite-gui
          echo D | xcopy ..\src .\src /E /I /Y
          python src\set_version.py "%BUILD_VERSION%"
          set PYTHONUTF8=1
          flet build ${{ matrix.target-platform }} --output ..\${{ matrix.target-platform }} --build-version "%BUILD_VERSION%" --python-version 3.12
          copy main.py ..\${{ matrix.target-platform }}

      - name: "Bundle Visual C++ CRT redistributables (Windows)"
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python - <<'PY'
          import glob, os, shutil
          from pathlib import Path

          out_dir = Path("${{ matrix.target-platform }}")
          crt_dlls = [
              "msvcp140.dll",
              "msvcp140_1.dll",
              "msvcp140_2.dll",
              "msvcp140_atomic_wait.dll",
              "vcruntime140.dll",
              "vcruntime140_1.dll",
              "concrt140.dll",
          ]
          search_dirs = []
          for root_pat in (
              r"C:\Program Files\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT",
              r"C:\Program Files (x86)\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT",
          ):
              matches = sorted((Path(p) for p in glob.glob(root_pat)), reverse=True)
              search_dirs.extend(m for m in matches if m.is_dir())
          sys32 = Path(os.environ.get("SystemRoot", r"C:\Windows")) / "System32"
          if sys32.is_dir():
              search_dirs.append(sys32)

          for dll in crt_dlls:
              dest = out_dir / dll
              if dest.is_file():
                  print(f"[CRT] already present: {dll}")
                  continue
              copied = False
              for src_dir in search_dirs:
                  cand = src_dir / dll
                  if cand.is_file():
                      shutil.copy2(cand, dest)
                      print(f"[CRT] bundled {dll} from {cand}")
                      copied = True
                      break
              if not copied:
                  print(f"[CRT] optional/missing in search dirs: {dll}")
          PY

      - name: "Verify build artifact contents"
        shell: bash
        run: |
          python scripts/verify_flet_artifact.py \
            --output-dir "${{ matrix.target-platform }}" \
            --platform "${{ matrix.target-platform }}" \
            --variant "${{ matrix.variant }}" \
            --python-version 3.12

      - name: "Package build artifact"
        shell: bash
        run: |
          python scripts/package_flet_artifact.py \
            --source-dir "${{ matrix.target-platform }}" \
            --output "${BINARY_NAME}"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}
          path: ${{ env.BINARY_NAME }}
          retention-days: 14

      - name: "Upload Release"
        if: github.event_name == 'push' || inputs.create_release
        # NOTE: use the env context instead of shell variables so this also
        # works on Windows, where the default shell is PowerShell and
        # `$NAME` does not read environment variables (empty -> gh glob error).
        run: gh release upload "${{ env.RELEASE_TAG }}" "${{ env.BINARY_NAME }}" --clobber

  publish-release:
    needs: [create-release, cross-build]
    if: always() && needs.cross-build.result == 'success' && (github.event_name == 'push' || inputs.create_release)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: "Publish release (draft -> public)"
        # No checkout in this job, so gh cannot infer the repository from a
        # git remote: pass it explicitly.
        run: |
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,assets \
            --jq '.tagName, .isDraft, (.assets[] | "\(.name) \(.size)")'
